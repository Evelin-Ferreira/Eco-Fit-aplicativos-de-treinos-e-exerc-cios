<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Eco-Fit</title>
</head>
<body>
    <h1>Fale Conosco</h1>
    <p>Tem alguma dúvida, sugestão ou feedback sobre o Eco-Fit? Entre em contato com a nossa equipe!</p>

    <form>
        <p>
            <label for="nome">Seu Nome:</label><br>
            <input type="text" id="nome" name="nome" required>
        </p>
        
        <p>
            <label for="email">Seu E-mail:</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        
        <p>
            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30" required></textarea>
        </p>
        
        <p>
            <button type="submit">Enviar Mensagem</button>
        </p>
    </form>

    <br>
    <p><a href="index.html">← Voltar para a Página Inicial</a></p>
</body>
</html>
